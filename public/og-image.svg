<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Subtle Cyberpunk/Xianxia Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Decorative Outer Border -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 1150 80 L 1150 50 L 1120 50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 50 550 L 50 580 L 80 580" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 1150 550 L 1150 580 L 1120 580" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Badge / Tagline -->
  <g transform="translate(100, 110)">
    <rect x="0" y="0" width="310" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="21" r="7" fill="#10b981" />
    <text x="40" y="27" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">TIÊN HIỆP TỐC KÝ ARENA</text>
  </g>

  <!-- Title: FASTTYPING -->
  <text x="100" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="74" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    FastTyping Tu Tiên
  </text>

  <!-- Subtitle -->
  <text x="100" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="700" fill="url(#subGrad)">
    Đấu Trường Gõ Phím Tiếng Việt Thời Gian Thực
  </text>

  <!-- Bullet Features Pills -->
  <g transform="translate(100, 375)">
    <!-- Pill 1: Multiplayer Rooms -->
    <g transform="translate(0, 0)">
      <rect width="210" height="48" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="24" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#38bdf8">⚔️ Đua Phòng 8 Người</text>
    </g>

    <!-- Pill 2: Săn Boss -->
    <g transform="translate(225, 0)">
      <rect width="180" height="48" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="24" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#f43f5e">🐉 Săn Boss Cổ Ma</text>
    </g>

    <!-- Pill 3: Tông Môn -->
    <g transform="translate(420, 0)">
      <rect width="180" height="48" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="24" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#eab308">🏰 Lập Tông Môn</text>
    </g>

    <!-- Pill 4: Bảng Vàng WPM -->
    <g transform="translate(615, 0)">
      <rect width="190" height="48" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="24" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#10b981">🏆 Bảng Vàng Toàn Cầu</text>
    </g>
  </g>

  <!-- Bottom CTA & Brand URL -->
  <g transform="translate(100, 490)">
    <text x="0" y="35" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#94a3b8">
      Luyện ngón 10 ngón • Đột phá cảnh giới • Phi thăng tiên giới
    </text>
    <text x="750" y="35" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#38bdf8">
      ⚡ fasttyping.vn
    </text>
  </g>
</svg>
