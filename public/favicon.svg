<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Keycap Border / Glow -->
    <linearGradient id="keyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Keycap Surface -->
    <linearGradient id="keySurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Sword / Energy Blade Gradient -->
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Lightning / Qi Gradient -->
    <linearGradient id="qiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#keyBorder)" stroke-width="2" />

  <!-- Mechanical Keycap 3D Chamfer -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#keySurface)" stroke="#334155" stroke-width="1.5" />
  <!-- Keycap Top Inner Plate -->
  <rect x="12" y="11" width="40" height="40" rx="7" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />

  <!-- Celestial Flying Sword (Xianxia Blade) -->
  <g filter="url(#glow)">
    <!-- Blade Back / Aura -->
    <path d="M 44 14 L 48 18 L 27 39 L 23 35 Z" fill="#38bdf8" fill-opacity="0.9" />
    <!-- Sword Tip & Blade Core -->
    <path d="M 47 13 L 50 16 L 28 38 L 24 38 L 24 34 Z" fill="url(#swordGrad)" />
    <!-- Blade Ridge highlight -->
    <line x1="48" y1="14" x2="26" y2="36" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- Sword Guard -->
    <path d="M 21 33 L 29 41 L 27 43 L 19 35 Z" fill="#eab308" />
    <!-- Sword Hilt -->
    <path d="M 22 38 L 17 43 L 15 41 L 20 36 Z" fill="#b45309" />
    <!-- Pommel Gem -->
    <circle cx="15" cy="43" r="2.5" fill="#f59e0b" stroke="#fef08a" stroke-width="0.8" />
  </g>

  <!-- Speed Lightning Bolt (WPM Qi Strike) -->
  <path d="M 33 22 L 25 33 L 31 33 L 26 44 L 39 31 L 33 31 Z" fill="url(#qiGrad)" filter="url(#glow)" />

  <!-- Sparkles / Qi Dots -->
  <circle cx="48" cy="27" r="1.5" fill="#38bdf8" />
  <circle cx="16" cy="18" r="1" fill="#fef08a" />
  <circle cx="44" cy="46" r="1.2" fill="#10b981" />
</svg>
