    <script>
      // Suppress benign Vite HMR websocket connection errors in proxy/iframe environment
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (
            msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1
          )) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && e.message && (
            e.message.indexOf('WebSocket closed without opened') !== -1 ||
            e.message.indexOf('[vite] failed to connect to websocket') !== -1
          )) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
